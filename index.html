<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글자 수 세기</title>
<style>
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #fff; color: #222; max-width: 560px; margin: 0 auto; padding: 80px 16px 40px; text-align: center; }
  h1 { font-size: 44px; font-weight: 900; letter-spacing: -1px; color: #03c75a; margin: 0 0 32px; }
  textarea { width: 100%; height: 160px; padding: 16px 20px; box-sizing: border-box; font-size: 16px; font-family: inherit; text-align: left; border: 2px solid #03c75a; border-radius: 12px; outline: none; resize: vertical; box-shadow: 0 2px 8px rgba(3, 199, 90, 0.15); }
  textarea:focus { box-shadow: 0 2px 12px rgba(3, 199, 90, 0.35); }
  button { margin: 12px 4px 0; padding: 10px 24px; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer; background: #7c3aed; color: #fff; border: none; border-radius: 8px; }
  button:hover { background: #6d28d9; }
  #result { margin-top: 24px; padding: 16px; font-size: 18px; background: #f5f6f7; border-radius: 12px; }
  #result:empty { display: none; }
  #result .over { color: #e00000; font-weight: bold; }
  #limit-row { margin-top: 12px; color: #666; }
  #limit { width: 90px; padding: 6px 8px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; }
  #limit:focus { border-color: #03c75a; outline: none; }
</style>
</head>
<body>
  <h1>글자 수 세기</h1>
  <textarea id="text" placeholder="여기에 글을 입력하세요"></textarea>
  <div id="limit-row">
    <label>제한 글자 수: <input type="number" id="limit" min="0" placeholder="없음"></label>
  </div>
  <button id="btn">글자 수 확인</button>
  <button id="clear">전체 지우기</button>
  <div id="result"></div>

  <script>
    function update() {
      var text = document.getElementById('text').value;
      var total = Array.from(text).length;
      var noSpace = Array.from(text.replace(/\s/g, '')).length;
      var limitText = document.getElementById('limit').value;
      var limit = limitText === '' ? null : Number(limitText);
      var result = document.getElementById('result');
      result.textContent = '';
      function addNumber(label, n) {
        result.appendChild(document.createTextNode(label));
        var span = document.createElement('span');
        span.textContent = n;
        if (limit !== null && n > limit) span.className = 'over';
        result.appendChild(span);
        result.appendChild(document.createTextNode('자'));
      }
      addNumber('공백 포함: ', total);
      result.appendChild(document.createTextNode(' / '));
      addNumber('공백 제외: ', noSpace);
    }
    document.getElementById('btn').addEventListener('click', update);
    document.getElementById('clear').addEventListener('click', function () {
      var box = document.getElementById('text');
      box.value = '';
      update();
      box.focus();
    });
    document.getElementById('limit').addEventListener('input', function () {
      if (document.getElementById('result').textContent) update();
    });
    document.getElementById('text').addEventListener('input', function () {
      // 이미 결과가 표시된 상태에서만 실시간 갱신
      if (document.getElementById('result').textContent) update();
    });
  </script>
</body>
</html>
